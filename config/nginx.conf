map $http_origin $cors_origin {
    default "$http_origin";
    "" "*";
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 8080;
    listen [::]:8080;
    server_name _;

    sub_filter '</head>' '<script>
const _nativeFetch = window.fetch;
window.fetch = async function(...args) {
  let attempts = 0;
  while (true) {
    attempts++;
    try {
      return await _nativeFetch.apply(this, args);
    } catch (err) {
      if (attempts >= 4) throw err;
      await new Promise(r => setTimeout(r, 150 * attempts));
    }
  }
};

window.nativeStorage = {
  _d: {"antigravityOnboarding": "true", "antigravityUnifiedStateSync.onboarding": "true", "antigravity.isLoggedIn": "true"},
  _listeners: new Set(),
  async getItems(keys) {
    if (!keys || !Array.isArray(keys) || keys.length === 0) {
      const items = Object.assign({}, this._d);
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k) items[k] = localStorage.getItem(k);
      }
      return Object.assign({}, items, {items: items});
    }
    const r = {};
    for (let i = 0; i < keys.length; i++) {
      r[keys[i]] = localStorage.getItem(keys[i]) || this._d[keys[i]] || "true";
    }
    return Object.assign({}, r, {items: r});
  },
  async updateItems(updates) {
    if (!updates) return;
    for (const [k, v] of Object.entries(updates)) {
      if (v === null || v === undefined) {
        localStorage.removeItem(k);
        delete this._d[k];
      } else {
        const val = typeof v === "string" ? v : JSON.stringify(v);
        localStorage.setItem(k, val);
        this._d[k] = val;
      }
    }
    this._listeners.forEach(cb => {
      try { cb(updates); } catch (e) {}
    });
  },
  async getItem(key) { return localStorage.getItem(key) || this._d[key]; },
  async setItem(key, value) { return this.updateItems({ [key]: value }); },
  async removeItem(key) { return this.updateItems({ [key]: null }); },
  onChanged(callback) {
    this._listeners.add(callback);
    return () => this._listeners.delete(callback);
  }
};

window.electronNative = {
  getZoomLevel: () => 1,
  setZoomLevel: () => {},
  openExternal: (url) => window.open(url, "_blank"),
  getSystemPreferences: async () => ({}),
  openSystemPreferences: async () => {},
  showNotification: () => {},
  getPlatform: () => "linux"
};

try {
  localStorage.setItem("antigravityOnboarding", "true");
  localStorage.setItem("antigravityUnifiedStateSync.onboarding", "true");
  localStorage.setItem("antigravity.isLoggedIn", "true");
} catch (e) {}
</script></head>';
    sub_filter_once on;
    sub_filter_types text/html;

