server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;

    # 1. Direct Stream Proxying to Go (Port 8081)
    # Bypasses Python proxy.py to eliminate async latency, connection pool, or HTTP/2 protocol issues.
    location ~ ^/exa.language_server_pb.LanguageServerService/(__NONE__) {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;

        # Prevent GCP HTTPS Load Balancer HTTP/2 RST_STREAM Protocol Error
        proxy_set_header Connection "";
        proxy_set_header Accept-Encoding "";
        
        # Go language_server requires 127.0.0.1 or localhost Host header
        proxy_set_header Host "127.0.0.1";
        
        # Keep chunked framing toward the LB: a close-delimited response (no
        # Content-Length, no chunked) is ambiguous at end-of-stream, and the
        # LB surfaces that as an HTTP/2 RST_STREAM (ERR_HTTP2_PROTOCOL_ERROR).
        chunked_transfer_encoding on;
        proxy_max_temp_file_size 0;

        # Disable gzip to prevent stream corruption or buffering
        gzip off;

        # Turn off proxy buffering for instant real-time event delivery
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # 2. General frontend UI, auth mocks, and API calls to Python proxy.py (8082)
    # proxy.py injects the gcloud Bearer auth token and the window.nativeStorage polyfill
    location / {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # Turn off proxy buffering for regular requests
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
