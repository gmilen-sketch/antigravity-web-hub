server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;

    # Cloud Web Electron Storage & Workspace Dialog Polyfill + Bootstrap Script
    sub_filter '<head>' '<head><script>window.nativeStorage={_d:{"antigravityOnboarding":"true","antigravityUnifiedStateSync.onboarding":"true","antigravity.isLoggedIn":"true"},getItems:async function(k){if(!k||!Array.isArray(k)||k.length===0)return Object.assign({},this._d,{items:this._d});var r={};for(var i=0;i<k.length;i++)r[k[i]]=this._d[k[i]]||"true";return Object.assign(r,{items:r});},updateItems:async function(i){if(i&&typeof i==="object"){for(var k in i)this._d[k]=i[k];}if(this._l)this._l(i);return true;},onChanged:function(c){this._l=c;}};try{localStorage.setItem("antigravityOnboarding","true");localStorage.setItem("antigravityUnifiedStateSync.onboarding","true");localStorage.setItem("antigravity.isLoggedIn","true");}catch(e){}window.dialog={showOpenDialog:async function(){var name=prompt("Enter project directory name under /mnt/data/projects/:","my-quick-project");if(!name)return null;try{await fetch("/api/create-project-dir?name="+encodeURIComponent(name));}catch(e){console.error(e);}return"/mnt/data/projects/"+name;}};</script><script src="/bootstrap.js?v=3.9.0-native"></script>';
    sub_filter_once on;

    location = /bootstrap.js {
        root /var/www/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /antigravity-release.json {
        root /var/www/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:8081/healthz;
        proxy_http_version 1.1;
        proxy_set_header Host "127.0.0.1:8081";
        proxy_set_header Connection "";
    }

    # REST APIs for release manifest, Knowledge Graph inspection, and project dir creation
    location /api/ {
        proxy_pass http://127.0.0.1:8083;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # A2A (Agent-to-Agent) Execution Endpoint
    location /a2a/ {
        proxy_pass http://127.0.0.1:8083;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host "127.0.0.1:8083";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Vertex AI Model Catalog & Gateway Control-Plane Routes (+ deprecated GetAllCustomAgentConfigs disk adapter)
    location ~ ^/(exa\.language_server_pb\.LanguageServerService/(HasAuthToken|GetAuthStatus|LoginWithBrowser|GetUserStatus|GetCascadeModelConfig|GetCascadeModelConfigData|GetCommandModelConfigs|JetboxWriteState|GetAllCustomAgentConfigs|StartCascade|SendUserCascadeMessage)|v1internal[:/]|loadCodeAssist|onboardUser|fetchUserInfo|retrieveUserQuotaSummary|listExperiments|ListExperiments|fetchAdminControls|fetchAvailableModels) {
        proxy_pass http://127.0.0.1:8083;
        proxy_http_version 1.1;
        proxy_set_header Accept-Encoding "";
        proxy_set_header Connection "";
        proxy_set_header Host "127.0.0.1:8083";
        proxy_set_header X-User-Email $http_x_goog_authenticated_user_email;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Native Go language_server (:8081) for all streaming state updates, trajectories, MCPs, plugins, skills, rules & auth
    location /exa.language_server_pb.LanguageServerService/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host "127.0.0.1:8081";
        proxy_set_header Origin "http://127.0.0.1:8081";
        proxy_set_header x-codeium-csrf-token "antigravity_secret_csrf_token_12345";
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_max_temp_file_size 0;
        gzip off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        client_max_body_size 100M;

        proxy_set_header X-User-Email $http_x_goog_authenticated_user_email;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Embedded Antigravity 2.0 Web UI assets from language_server (:8081)
    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Accept-Encoding "";
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_max_temp_file_size 0;
        gzip off;
        proxy_set_header Connection "";
        proxy_set_header Host "127.0.0.1:8081";
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-User-Email $http_x_goog_authenticated_user_email;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;

        add_header Set-Cookie "csrfToken=antigravity_secret_csrf_token_12345; Path=/; SameSite=None; Secure" always;
        add_header Content-Security-Policy "frame-ancestors 'self' https://vertexaisearch.cloud.google.com https://*.cloud.google.com https://gemini.google.com https://*.google.com;" always;
    }
}
