server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;

    # Bypasses Onboarding Screen with Bulletproof nativeStorage Polyfill
    sub_filter '<head>' '<head><script>window.nativeStorage={_d:{"antigravityOnboarding":"true","antigravityUnifiedStateSync.onboarding":"true","antigravity.isLoggedIn":"true"},getItems:async function(k){if(!k||!Array.isArray(k)||k.length===0)return Object.assign({},this._d,{items:this._d});var r={};for(var i=0;i<k.length;i++)r[k[i]]=this._d[k[i]]||"true";return Object.assign(r,{items:r});},updateItems:async function(i){if(i&&typeof i==="object"){for(var k in i)this._d[k]=i[k];}if(this._l)this._l(i);return true;},onChanged:function(c){this._l=c;}};try{localStorage.setItem("antigravityOnboarding","true");localStorage.setItem("antigravityUnifiedStateSync.onboarding","true");localStorage.setItem("antigravity.isLoggedIn","true");}catch(e){}window.dialog={showOpenDialog:async function(){var name=prompt("Enter project directory name under /mnt/data/projects/:","my-quick-project");if(!name)return null;try{await fetch("/api/create-project-dir?name="+encodeURIComponent(name));}catch(e){console.error(e);}return"/mnt/data/projects/"+name;}};</script>';
    sub_filter_once on;

    # Intercept custom directory creation & Knowledge Graph REST APIs
    location /api/ {
        proxy_pass http://127.0.0.1:8083;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # A2A (Agent-to-Agent) Execution Endpoint for Gemini Enterprise
    location /a2a/ {
        proxy_pass http://127.0.0.1:8083;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host "127.0.0.1:8083";
        proxy_buffering off;
        proxy_cache off;
    }

    # Intercept Auth & Configuration APIs to bypass onboarding
    location ~ ^/(exa\.language_server_pb\.LanguageServerService/(GetAuthStatus|HasAuthToken|LoginWithBrowser|GetCascadeModelConfig|GetCommandModelConfigs)|v1internal/|loadCodeAssist|fetchUserInfo|listExperiments|ListExperiments|fetchAdminControls|fetchAvailableModels) {
        proxy_pass http://127.0.0.1:8083;
        proxy_http_version 1.1;
        proxy_set_header Accept-Encoding "";
        proxy_set_header Connection "";
        proxy_set_header Host "127.0.0.1:8083";
        proxy_set_header X-User-Email $http_x_goog_authenticated_user_email;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
    }

    # 1. Intercept unary GetUserStatus to inject custom model dropdown list and sorts
    location = /exa.language_server_pb.LanguageServerService/GetUserStatus {
        proxy_pass http://127.0.0.1:8083;
        proxy_http_version 1.1;
        proxy_set_header Accept-Encoding "";
        proxy_set_header Connection "";
        proxy_set_header Host "127.0.0.1:8083";
        proxy_set_header X-User-Email $http_x_goog_authenticated_user_email;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
    }





    # 2. Intercept StartCascade to inject DEFAULT_MODEL and configure planner defaults
    location = /exa.language_server_pb.LanguageServerService/StartCascade {
        proxy_pass http://127.0.0.1:8083;
        proxy_http_version 1.1;
        proxy_set_header Accept-Encoding "";
        proxy_set_header Connection "";
        proxy_set_header Host "127.0.0.1:8083";
        proxy_set_header X-User-Email $http_x_goog_authenticated_user_email;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
    }

    # 3. Intercept GetSlashCommands to inject model config
    location = /exa.language_server_pb.LanguageServerService/GetSlashCommands {
        proxy_pass http://127.0.0.1:8083;
        proxy_http_version 1.1;
        proxy_set_header Accept-Encoding "";
        proxy_set_header Connection "";
        proxy_set_header Host "127.0.0.1:8083";
        proxy_set_header X-User-Email $http_x_goog_authenticated_user_email;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
    }

    # 4. Intercept SendUserCascadeMessage to inject model config and stream real-time responses
    location = /exa.language_server_pb.LanguageServerService/SendUserCascadeMessage {
        proxy_pass http://127.0.0.1:8083;
        proxy_http_version 1.1;
        proxy_set_header Accept-Encoding "";
        proxy_set_header Connection "";
        proxy_set_header Host "127.0.0.1:8083";
        proxy_set_header X-User-Email $http_x_goog_authenticated_user_email;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
    }

    # 4b. Intercept StreamAgentStateUpdates to respect the readiness lock
    location = /exa.language_server_pb.LanguageServerService/StreamAgentStateUpdates {
        proxy_pass http://127.0.0.1:8083;
        proxy_http_version 1.1;
        proxy_set_header Accept-Encoding "";
        proxy_set_header Connection "";
        proxy_set_header Host "127.0.0.1:8083";
        proxy_set_header X-User-Email $http_x_goog_authenticated_user_email;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
    }

    # 4c. Intercept UpdateConversationAnnotations to respect the readiness lock
    location = /exa.language_server_pb.LanguageServerService/UpdateConversationAnnotations {
        proxy_pass http://127.0.0.1:8083;
        proxy_http_version 1.1;
        proxy_set_header Accept-Encoding "";
        proxy_set_header Connection "";
        proxy_set_header Host "127.0.0.1:8083";
        proxy_set_header X-User-Email $http_x_goog_authenticated_user_email;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
    }

    # 4d. Intercept FetchConversationAnnotations to respect the readiness lock
    location = /exa.language_server_pb.LanguageServerService/FetchConversationAnnotations {
        proxy_pass http://127.0.0.1:8083;
        proxy_http_version 1.1;
        proxy_set_header Accept-Encoding "";
        proxy_set_header Connection "";
        proxy_set_header Host "127.0.0.1:8083";
        proxy_set_header X-User-Email $http_x_goog_authenticated_user_email;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
    }

    # 5. Optimize Nginx for remaining gRPC-Web paths
    location /exa.language_server_pb.LanguageServerService/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host "127.0.0.1:8081";
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_max_temp_file_size 0;
        gzip off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        client_max_body_size 100M;
        
        # Forward IAP Identity Header
        proxy_set_header X-User-Email $http_x_goog_authenticated_user_email;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 6. General frontend & assets with IAP header forwarding
    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Accept-Encoding "";
        
        # Disable buffering and enable chunked encoding for responsive streaming and WebSockets
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_max_temp_file_size 0;
        
        # Turn off gzip to prevent buffering
        gzip off;

        # Standard HTTP/1.1 keep-alive
        proxy_set_header Connection "";
        
        # Override Host to satisfy language_server local security check
        proxy_set_header Host "127.0.0.1:8081";
        proxy_set_header X-Forwarded-Host $host;
        
        # Extract and forward IAP Identity headers for user workspace isolation
        proxy_set_header X-User-Email $http_x_goog_authenticated_user_email;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;

        # Inject CSRF token cookie required by the Antigravity React SPA frontend
        add_header Set-Cookie "csrfToken=antigravity_secret_csrf_token_12345; Path=/; SameSite=None; Secure" always;
        
        # Permit iframe embedding inside Vertex AI Search / Gemini Enterprise portals
        add_header Content-Security-Policy "frame-ancestors 'self' https://vertexaisearch.cloud.google.com https://*.cloud.google.com https://gemini.google.com https://*.google.com;" always;
    }
}
