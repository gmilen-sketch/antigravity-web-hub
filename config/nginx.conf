server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;

    # Bypasses Onboarding Screen
    sub_filter '<head>' '<head><script>window.nativeStorage={_d:{"antigravityOnboarding":"true","antigravityUnifiedStateSync.onboarding":"true","antigravity.isLoggedIn":"true"},getItems:async function(k){if(!k)return this._d;var r={};for(var i=0;i<k.length;i++)r[k[i]]=this._d[k[i]]||"true";return r;},updateItems:async function(i){for(var k in i)this._d[k]=i[k];if(this._l)this._l(i);return true;},onChanged:function(c){this._l=c;}};try{localStorage.setItem("antigravityOnboarding","true");localStorage.setItem("antigravityUnifiedStateSync.onboarding":"true");}catch(e){}window.dialog={showOpenDialog:async function(){var name=prompt("Enter project directory name under /mnt/data/projects/:","my-quick-project");if(!name)return null;try{await fetch("/api/create-project-dir?name="+encodeURIComponent(name));}catch(e){console.error(e);}return"/mnt/data/projects/"+name;}};</script>';
    sub_filter_once on;

    # Intercept custom directory creation API
    location /api/create-project-dir {
        proxy_pass http://127.0.0.1:8083;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # 1. Intercept unary GetUserStatus to inject custom model dropdown list and sorts
    location = /exa.language_server_pb.LanguageServerService/GetUserStatus {
        proxy_pass http://127.0.0.1:8083;
        proxy_http_version 1.1;
        proxy_set_header Accept-Encoding "";
        proxy_set_header Connection "";
        proxy_set_header Host "127.0.0.1:8083";
        proxy_set_header X-User-Email $http_x_goog_authenticated_user_email;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
    }

    # 2. Intercept unary StartCascade to inject DEFAULT_MODEL and configure planner defaults
    location = /exa.language_server_pb.LanguageServerService/StartCascade {
        proxy_pass http://127.0.0.1:8083;
        proxy_http_version 1.1;
        proxy_set_header Accept-Encoding "";
        proxy_set_header Connection "";
        proxy_set_header Host "127.0.0.1:8083";
        proxy_set_header X-User-Email $http_x_goog_authenticated_user_email;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
    }

    # 3. Optimize Nginx for gRPC-Web Streaming via native grpc_pass with extended timeouts
    location /exa.language_server_pb.LanguageServerService/ {
        grpc_pass grpc://127.0.0.1:8081;
        grpc_read_timeout 86400s;
        grpc_send_timeout 86400s;
        client_max_body_size 100M;
        
        # Forward IAP Identity Header
        grpc_set_header X-User-Email $http_x_goog_authenticated_user_email;
    }


    # 2. General frontend & assets with IAP header forwarding
    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Accept-Encoding "";
        
        # Disable buffering and enable chunked encoding for responsive streaming and WebSockets
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_max_temp_file_size 0;
        
        # Turn off gzip to prevent buffering
        gzip off;

        # Standard HTTP/1.1 keep-alive (no fake Upgrade or Connection upgrade headers)
        proxy_set_header Connection "";
        
        # Override Host to satisfy language_server local security check
        proxy_set_header Host "127.0.0.1:8081";
        proxy_set_header X-Forwarded-Host $host;
        
        # Extract and forward IAP Identity headers for user workspace isolation
        proxy_set_header X-User-Email $http_x_goog_authenticated_user_email;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
