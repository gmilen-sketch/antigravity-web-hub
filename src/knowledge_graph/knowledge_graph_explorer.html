<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Antigravity Knowledge Graph 3D Explorer</title>
  <style>
    :root {
      --background: #0f172a;
      --foreground: #f8fafc;
      --card: #1e293b;
      --border: #334155;
      --primary: #38bdf8;
    }
    body {
      margin: 0;
      padding: 16px;
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--background);
      color: var(--foreground);
      font-size: 13px;
    }
    .kpi-row {
      display: flex;
      gap: 12px;
      margin-bottom: 16px;
    }
    .kpi-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 16px;
      flex: 1;
    }
    .canvas-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
    }
  </style>
</head>
<body>
  <div class="kpi-row">
    <div class="kpi-card"><strong>Knowledge Graph Nodes</strong><div>OKF v0.4 Bi-Temporal Active</div></div>
    <div class="kpi-card"><strong>Traversal Engine</strong><div>Personalized PageRank (alpha=0.85)</div></div>
    <div class="kpi-card"><strong>Warm Cache</strong><div>/dev/shm/kg_warm_cache.json (&lt;1ms)</div></div>
  </div>
  <div class="canvas-box">
    <svg width="680" height="180" viewBox="0 0 680 180">
      <rect id="node-hub" x="20" y="50" width="180" height="72" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
      <text x="40" y="90" fill="#f8fafc" font-size="13">Antigravity Web Hub</text>
      <rect id="node-kg" x="250" y="50" width="180" height="72" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="2" />
      <text x="270" y="90" fill="#f8fafc" font-size="13">OKF v0.4 Graph Memory</text>
      <rect id="node-eval" x="480" y="50" width="180" height="72" rx="8" fill="#1e293b" stroke="#a78bfa" stroke-width="2" />
      <text x="500" y="90" fill="#f8fafc" font-size="13">2-Stage Black-Hat Gate</text>
    </svg>
  </div>
</body>
</html>
